<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Public Security Section 9 personnel file PS-0927-K: Syrov Philipp. Clearance level 3, builder. Status: shipping.">
